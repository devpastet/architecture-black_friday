name: sharding-repl-cache

services:
  # Config server: метаданные кластера (распределение чанков по шардам)
  configSrv:
    image: mongo:7.0
    container_name: configSrv
    hostname: configSrv
    restart: always
    command: ["mongod", "--configsvr", "--replSet", "config_server", "--bind_ip_all", "--port", "27017", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - configSrv-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      start_period: 10s

  # Шард 1: replica set shard1 из трёх узлов (1 PRIMARY + 2 SECONDARY)
  shard1-1:
    image: mongo:7.0
    container_name: shard1-1
    hostname: shard1-1
    restart: always
    command: ["mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard1-1-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      start_period: 10s

  shard1-2:
    image: mongo:7.0
    container_name: shard1-2
    hostname: shard1-2
    restart: always
    command: ["mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard1-2-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      start_period: 10s

  shard1-3:
    image: mongo:7.0
    container_name: shard1-3
    hostname: shard1-3
    restart: always
    command: ["mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard1-3-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      start_period: 10s

  # Шард 2: replica set shard2 из трёх узлов (1 PRIMARY + 2 SECONDARY)
  shard2-1:
    image: mongo:7.0
    container_name: shard2-1
    hostname: shard2-1
    restart: always
    command: ["mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard2-1-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      start_period: 10s

  shard2-2:
    image: mongo:7.0
    container_name: shard2-2
    hostname: shard2-2
    restart: always
    command: ["mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard2-2-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      start_period: 10s

  shard2-3:
    image: mongo:7.0
    container_name: shard2-3
    hostname: shard2-3
    restart: always
    command: ["mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27019", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard2-3-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      start_period: 10s

  # Роутер: единая точка входа для приложения, маршрутизирует запросы по шардам
  mongos_router:
    image: mongo:7.0
    container_name: mongos_router
    hostname: mongos_router
    restart: always
    command: ["mongos", "--configdb", "config_server/configSrv:27017", "--bind_ip_all", "--port", "27020"]
    depends_on:
      - configSrv
      - shard1-1
      - shard1-2
      - shard1-3
      - shard2-1
      - shard2-2
      - shard2-3

  # Redis: кеш ответов API (эндпоинт /<collection_name>/users)
  redis:
    image: redis:7.4-alpine
    hostname: redis
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  pymongo_api:
    image: kazhem/pymongo_api:1.0.0
    container_name: pymongo_api
    restart: always
    depends_on:
      - mongos_router
      - redis
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos_router:27020"
      MONGODB_DATABASE_NAME: "somedb"
      REDIS_URL: "redis://redis:6379"

volumes:
  configSrv-data:
  shard1-1-data:
  shard1-2-data:
  shard1-3-data:
  shard2-1-data:
  shard2-2-data:
  shard2-3-data:
  redis-data:
